<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#090D16"/>
  <defs>
    <linearGradient id="pulseGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="256" y1="120" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background subtle grid rings -->
  <circle cx="256" cy="256" r="180" stroke="#1E293B" stroke-width="6" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="550 200" filter="url(#glow)"/>
  
  <!-- Pulse electrocardiogram wave / habit streak spark -->
  <path d="M120 256 H190 L220 180 L256 320 L290 220 L320 256 H392" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Flame streak tip -->
  <circle cx="290" cy="220" r="12" fill="#F59E0B" filter="url(#glow)"/>
  <circle cx="220" cy="180" r="10" fill="#06B6D4" filter="url(#glow)"/>
</svg>
